name: build-and-test

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:

jobs:
    # Upload and download actions are used since
    # gh command isn't available in the docker container and
    # it's hard to set it up in the container.
    download-test-data:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
              with:
                  fetch-depth: 0

            - name: Download test data
              run: |
                  gh release download t4-sample-0-2026-06-30 -D tests/data/t4_sample_0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload data for build-and-test
              uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
              with:
                  name: test-data
                  path: tests/data/t4_sample_0/

    build-and-test:
        name: build-and-test (${{ matrix.rosdistro }})
        needs: download-test-data
        runs-on: ubuntu-latest
        timeout-minutes: 20
        container:
            image: ros:${{ matrix.rosdistro }}
        strategy:
            matrix:
                rosdistro:
                    - humble
                    - jazzy
        steps:
            - name: Check out repository
              uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
              with:
                  fetch-depth: 0

            - name: Install dependencies
              run: |
                  apt update -yqq
                  apt install -yqq curl python3-venv python-is-python3 \
                    libgl1-mesa-dev libboost-dev ros-${ROS_DISTRO}-sensor-msgs-py ros-${ROS_DISTRO}-rosbag2-storage-mcap \
                    ros-${ROS_DISTRO}-radar-msgs unzip tree rsync

            - name: Download test data
              uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
              with:
                  name: test-data
                  path: tests/data/t4_sample_0

            - name: Unzip test data
              run: |
                  unzip 'tests/data/t4_sample_0/*.zip' -d tests/data/t4_sample_0/

            - name: Check test data
              run: |
                  tree tests/data

            # Inlined from autowarefoundation/autoware-github-actions/colcon-build, which references actions by tag
            - name: Build autoware perception messages
              env:
                  TARGET_PACKAGES: autoware_auto_perception_msgs autoware_perception_msgs tier4_perception_msgs vehicle_msgs
              run: |
                  mkdir -p dependency_ws
                  vcs import --recursive dependency_ws < build_depends.repos
                  rosdep update
                  package_paths=$(colcon list -p --packages-above-and-dependencies ${TARGET_PACKAGES} --base-paths . dependency_ws)
                  DEBIAN_FRONTEND=noninteractive rosdep install -yqq --from-paths ${package_paths} --ignore-src --rosdistro ${ROS_DISTRO}
                  . /opt/ros/${ROS_DISTRO}/setup.sh
                  colcon build \
                    --event-handlers console_cohesion+ \
                    --packages-above-and-dependencies ${TARGET_PACKAGES} \
                    --cmake-args -DCMAKE_BUILD_TYPE=Release

            - name: Check python version
              run: |
                  python -V

            - name: Install uv
              run: |
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Check uv version
              run: |
                  uv --version

            - name: Install python packages
              run: |
                  # use the ROS distro's system interpreter so compiled ROS modules (rclpy) import
                  export UV_PYTHON="$(which python3)"
                  echo "UV_PYTHON=${UV_PYTHON}" >> "$GITHUB_ENV"
                  uv sync --locked

            - name: Test with pytest
              run: |
                  . /opt/ros/$ROS_DISTRO/setup.sh
                  . ./install/setup.sh
                  uv run pytest tests -v
