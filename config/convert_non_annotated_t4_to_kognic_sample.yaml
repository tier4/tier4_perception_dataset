task: convert_non_annotated_t4_to_kognic
conversion:
  input_base: ./data/non_annotated_t4_format
  output_base: ./data/kognic_format
  workers_number: 12
  annotation_hz: 1
  generate_tsv_report: true  # Write <output_base>/conversion_report.tsv after conversion.
  camera_sensors:
    - channel: CAM_FRONT
    - channel: CAM_FRONT_RIGHT
    - channel: CAM_BACK_RIGHT
    - channel: CAM_BACK
    - channel: CAM_BACK_LEFT
    - channel: CAM_FRONT_LEFT
  # lidar_point_stride: 5 # optional: the stride of the lidar points to be used. Any columns greater than this stride will be skipped.
